{% extends "base.html" %}

{% block title %}404 - Page Not Found | Lead Extractor{% endblock %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="{{ dashboard_url }}" class="btn btn-secondary">Go to Dashboard</a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem;
    }

    .error-content {
        text-align: center;
        color: white;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 800;
        margin: 0;
        line-height: 1;
        opacity: 0.9;
    }

    .error-title {
        font-size: 2rem;
        margin: 1rem 0;
        font-weight: 600;
    }

    .error-message {
        font-size: 1.1rem;
        margin: 1rem 0 2rem;
        opacity: 0.9;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    @media (max-width: 768px) {
        .error-code {
            font-size: 5rem;
        }

        .error-title {
            font-size: 1.5rem;
        }

        .error-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}
