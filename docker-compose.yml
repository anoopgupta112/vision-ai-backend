services:
  web:
    build: .
    container_name: lead_extractor_landing
    restart: unless-stopped

    # Expose ONLY to localhost (nginx will proxy to this)
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://lead.visionaitech.cloud}

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
