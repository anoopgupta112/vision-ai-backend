services:
  redis:
    image: redis:7-alpine
    container_name: platform_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_network

  api:
    build: .
    container_name: platform_api
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 300 app:create_app()
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@platform_mongodb:27017/?authSource=admin
      - MONGODB_DATABASE=${MONGODB_DATABASE:-platform_db}
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Lead Gen Platform}
      - MAX_LEADS_PER_JOB=${MAX_LEADS_PER_JOB:-500}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - platform_network
      - shared_db_network

  worker:
    build: .
    container_name: platform_worker
    restart: unless-stopped
    command: python worker.py
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@platform_mongodb:27017/?authSource=admin
      - MONGODB_DATABASE=${MONGODB_DATABASE:-platform_db}
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Lead Gen Platform}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - platform_network
      - shared_db_network

volumes:
  redis_data:

networks:
  platform_network:
    driver: bridge
  shared_db_network:
    external: true
