name: Automation Orchestrator

on:
  # Re-enable later if you want automatic interval runs again.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode'
        required: true
        default: true
        type: boolean
      execute_branches:
        description: 'Prepare backend and frontend branches'
        required: true
        default: false
        type: boolean
      execute_codex:
        description: 'Run Codex for backend and frontend'
        required: true
        default: false
        type: boolean
      execute_validation:
        description: 'Run backend/frontend validation checks'
        required: true
        default: true
        type: boolean
      execute_pushes:
        description: 'Commit and push backend/frontend branches'
        required: true
        default: false
        type: boolean
      execute_prs:
        description: 'Create pull requests with gh'
        required: true
        default: false
        type: boolean
      max_retries:
        description: 'Maximum Codex/validation retry attempts'
        required: true
        default: '3'
        type: string

jobs:
  orchestrate:
    name: Run Automation Orchestrator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      BACKEND_REPO_PATH: ${{ github.workspace }}
      FRONTEND_REPO_PATH: ${{ github.workspace }}/frontend_workspace
      AUTOMATION_ENABLE_DISCOVERY: "true"
      AUTOMATION_ENABLE_EXECUTION: ${{ vars.AUTOMATION_ENABLE_EXECUTION || 'true' }}
      AUTOMATION_AUTO_APPROVE: ${{ vars.AUTOMATION_AUTO_APPROVE || 'true' }}
      AUTOMATION_FORCE_PRS: ${{ vars.AUTOMATION_FORCE_PRS || 'true' }}
      AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: anoopgupta112/vision-ai-frontend
          path: frontend_workspace
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_workspace/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend_workspace
        run: npm install

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure Git identity
        run: |
          git config --global user.name "automation-bot"
          git config --global user.email "automation-bot@users.noreply.github.com"

      - name: Verify GitHub authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Run orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARGS=()

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute_branches }}" == "true" ]]; then
            ARGS+=(--execute-branches)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute_codex }}" == "true" ]]; then
            ARGS+=(--execute-codex)
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ARGS+=(--execute-validation)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute_validation }}" == "true" ]]; then
            ARGS+=(--execute-validation)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute_prs }}" == "true" ]]; then
            ARGS+=(--execute-prs)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.execute_pushes }}" == "true" ]]; then
            ARGS+=(--execute-pushes)
          fi

          if [[ "${AUTOMATION_ENABLE_DISCOVERY}" == "true" ]]; then
            ARGS+=(--discover)
          fi

          if [[ "${AUTOMATION_AUTO_APPROVE}" == "true" ]]; then
            ARGS+=(--auto-approve)
          fi

          if [[ "${AUTOMATION_FORCE_PRS}" == "true" ]]; then
            ARGS+=(--force-prs)
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ARGS+=(--max-retries "${{ inputs.max_retries }}")
          fi

          if [[ "${{ github.event_name }}" == "schedule" && "${AUTOMATION_ENABLE_EXECUTION}" == "true" ]]; then
            ARGS=(--discover --auto-approve --force-prs --execute-branches --execute-codex --execute-validation --execute-pushes --execute-prs)
          fi

          python -m automation.orchestrator "${ARGS[@]}" | tee automation-run.json

      - name: Upload orchestrator output
        uses: actions/upload-artifact@v4
        with:
          name: automation-orchestrator-output
          path: automation-run.json
