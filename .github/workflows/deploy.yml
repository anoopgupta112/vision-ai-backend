name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euxo pipefail
          
            cd /root/deployed_repos/vision-ai-backend
          
            echo "== git status =="
            git status || true
          
            echo "== current branch =="
            git branch -vv || true
          
            echo "== remotes =="
            git remote -v || true
          
            echo "== fetch =="
            git fetch origin main
          
            echo "== reset hard to origin/main =="
            git reset --hard origin/main
          
            echo "== docker rebuild =="
            docker compose down
            docker compose up -d --build
            
            echo "== deployment complete =="
            docker compose ps

